name: Monitor trámite consular

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

concurrency:
  group: tramite-monitor
  cancel-in-progress: false

permissions:
  contents: write

env:
  TRAMITE_URL: https://sutramiteconsular.maec.es/
  REPLY_TIMEOUT_MIN: '8'
  NOTIFY_ALWAYS: 'false'

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIPO_TRAMITE: ${{ secrets.TIPO_TRAMITE }}
          IDENTIFICADOR: ${{ secrets.IDENTIFICADOR }}
          IDENTIFICADOR_ACCEDA: ${{ secrets.IDENTIFICADOR_ACCEDA }}
          ANIO_NACIMIENTO: ${{ secrets.ANIO_NACIMIENTO }}
        run: node run.js

      - name: Commit updated state
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update state [skip ci]"
            git push
          fi
